# One-off: uploads the Mac's original price log history (backfill/prices.db, 2026-10-23) to the bucket, merged with any
# days already published. Removed, with backfill/, once it has run.
name: Backfill
on: workflow_dispatch
concurrency: price-log  # shared with price-log.yml, so the two never write days.json at once
permissions: {}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 price-log.py export out backfill/prices.db "$PRICE_LOG_URL"
        env:
          PRICE_LOG_URL: ${{ vars.PRICE_LOG_URL }}
      - run: ./upload.sh out
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
